name: Guardians UmpScorecards

on:
  schedule:
    # After typical night games US/Eastern; adjust as needed
    - cron: "35 15 * * *"
  workflow_dispatch:

concurrency:
  group: umpscorecards-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache run state
        uses: actions/cache@v5
        with:
          path: state/guardians-umpscorecards.json
          key: umpscorecards-state-${{ github.repository_id }}-${{ github.ref_name }}

      - name: Install package
        run: pip install -e .

      - name: Run monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python -m umpscorecards --days 14

      - name: Upload markdown artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: umpscorecards-series-md
          path: artifacts/guardians-umpscorecards/*.md
          if-no-files-found: ignore
